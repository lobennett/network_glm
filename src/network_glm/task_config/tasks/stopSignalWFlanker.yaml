tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: null

# Stop-signal × Flanker.
# go cells carry responses; stop cells (success/failure) are conditions of interest
# (no correctness filter). No memory_and_cue for this task.

regressors:
  go_congruent:   {amplitude: 1, duration: 1, subset: "trial_type == 'go_congruent' and key_press == correct_response and response_time >= 0.2"}
  go_incongruent: {amplitude: 1, duration: 1, subset: "trial_type == 'go_incongruent' and key_press == correct_response and response_time >= 0.2"}
  stop_success_congruent:   {amplitude: 1, duration: 1, subset: "trial_type == 'stop_success_congruent'"}
  stop_success_incongruent: {amplitude: 1, duration: 1, subset: "trial_type == 'stop_success_incongruent'"}
  stop_failure_congruent:   {amplitude: 1, duration: 1, subset: "trial_type == 'stop_failure_congruent'"}
  stop_failure_incongruent: {amplitude: 1, duration: 1, subset: "trial_type == 'stop_failure_incongruent'"}
  response_time: {amplitude: 1, duration: response_time, subset: "key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial'"}
  omission:      {amplitude: omission,    duration: duration, subset: null}
  commission:    {amplitude: commission,  duration: duration, subset: null}
  rt_fast:       {amplitude: rt_too_fast, duration: duration, subset: null}
  break_with_performance_feedback:
    amplitude: 1
    duration: duration
    subset: "trial_id == 'break_with_performance_feedback'"
    events_query_min_coverage: 0.0

contrasts:
  go_congruent: "go_congruent"
  go_incongruent: "go_incongruent"
  stop_success_congruent: "stop_success_congruent"
  stop_success_incongruent: "stop_success_incongruent"
  stop_failure_congruent: "stop_failure_congruent"
  stop_failure_incongruent: "stop_failure_incongruent"
  stop_success_go_pooled: "1/2*(stop_success_congruent + stop_success_incongruent) - 1/2*(go_congruent + go_incongruent)"
  stop_failure_go_pooled: "1/2*(stop_failure_congruent + stop_failure_incongruent) - 1/2*(go_congruent + go_incongruent)"
  stop_success_flanker_interaction: "1/2*(stop_success_incongruent - go_incongruent) - 1/2*(stop_success_congruent - go_congruent)"
  stop_failure_flanker_interaction: "1/2*(stop_failure_incongruent - go_incongruent) - 1/2*(stop_failure_congruent - go_congruent)"
  stop_success_congruent_go_congruent: "stop_success_congruent - go_congruent"
  go_incongruent_congruent: "go_incongruent - go_congruent"
  task-baseline: "1/6*(go_congruent + go_incongruent + stop_success_congruent + stop_success_incongruent + stop_failure_congruent + stop_failure_incongruent)"
