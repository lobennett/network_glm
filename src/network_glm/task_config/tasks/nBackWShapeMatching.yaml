tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: null

# N-back × Shape Matching. test_trial trial_type = {match,mismatch}_td_{same,diff,na}_{1back,2back}.
# Break here is 4 s (duration: duration handles it).

regressors:
  match_td_same_1back:    {amplitude: 1, duration: 1, subset: "trial_type == 'match_td_same_1back' and key_press == correct_response and response_time >= 0.2"}
  match_td_same_2back:    {amplitude: 1, duration: 1, subset: "trial_type == 'match_td_same_2back' and key_press == correct_response and response_time >= 0.2"}
  match_td_diff_1back:    {amplitude: 1, duration: 1, subset: "trial_type == 'match_td_diff_1back' and key_press == correct_response and response_time >= 0.2"}
  match_td_diff_2back:    {amplitude: 1, duration: 1, subset: "trial_type == 'match_td_diff_2back' and key_press == correct_response and response_time >= 0.2"}
  match_td_na_1back:      {amplitude: 1, duration: 1, subset: "trial_type == 'match_td_na_1back' and key_press == correct_response and response_time >= 0.2"}
  match_td_na_2back:      {amplitude: 1, duration: 1, subset: "trial_type == 'match_td_na_2back' and key_press == correct_response and response_time >= 0.2"}
  mismatch_td_same_1back: {amplitude: 1, duration: 1, subset: "trial_type == 'mismatch_td_same_1back' and key_press == correct_response and response_time >= 0.2"}
  mismatch_td_same_2back: {amplitude: 1, duration: 1, subset: "trial_type == 'mismatch_td_same_2back' and key_press == correct_response and response_time >= 0.2"}
  mismatch_td_diff_1back: {amplitude: 1, duration: 1, subset: "trial_type == 'mismatch_td_diff_1back' and key_press == correct_response and response_time >= 0.2"}
  mismatch_td_diff_2back: {amplitude: 1, duration: 1, subset: "trial_type == 'mismatch_td_diff_2back' and key_press == correct_response and response_time >= 0.2"}
  mismatch_td_na_1back:   {amplitude: 1, duration: 1, subset: "trial_type == 'mismatch_td_na_1back' and key_press == correct_response and response_time >= 0.2"}
  mismatch_td_na_2back:   {amplitude: 1, duration: 1, subset: "trial_type == 'mismatch_td_na_2back' and key_press == correct_response and response_time >= 0.2"}
  response_time:          {amplitude: 1, duration: response_time, subset: "key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial' and trial_type != 'n/a'"}
  omission:               {amplitude: omission,    duration: duration, subset: null}
  commission:             {amplitude: commission,  duration: duration, subset: null}
  rt_fast:                {amplitude: rt_too_fast, duration: duration, subset: null}
  break_with_performance_feedback:
    amplitude: 1
    duration: duration
    subset: "trial_id == 'break_with_performance_feedback'"
    events_query_min_coverage: 0.0

contrasts:
  match_td_same_1back:    "match_td_same_1back"
  match_td_same_2back:    "match_td_same_2back"
  match_td_diff_1back:    "match_td_diff_1back"
  match_td_diff_2back:    "match_td_diff_2back"
  match_td_na_1back:      "match_td_na_1back"
  match_td_na_2back:      "match_td_na_2back"
  mismatch_td_same_1back: "mismatch_td_same_1back"
  mismatch_td_same_2back: "mismatch_td_same_2back"
  mismatch_td_diff_1back: "mismatch_td_diff_1back"
  mismatch_td_diff_2back: "mismatch_td_diff_2back"
  mismatch_td_na_1back:   "mismatch_td_na_1back"
  mismatch_td_na_2back:   "mismatch_td_na_2back"
  twoBack_oneBack_SM_off: "1/2*(match_td_na_2back + mismatch_td_na_2back) - 1/2*(match_td_na_1back + mismatch_td_na_1back)"
  main_vars_nBack_off:    "1/2*(match_td_diff_1back + mismatch_td_diff_1back) - 1/2*(match_td_na_1back + mismatch_td_na_1back)"
  twoBack_oneBack_pooled: "1/6*(match_td_same_2back + match_td_diff_2back + match_td_na_2back + mismatch_td_same_2back + mismatch_td_diff_2back + mismatch_td_na_2back) - 1/6*(match_td_same_1back + match_td_diff_1back + match_td_na_1back + mismatch_td_same_1back + mismatch_td_diff_1back + mismatch_td_na_1back)"
  main_vars_pooled:       "1/4*(match_td_diff_2back + match_td_diff_1back + mismatch_td_diff_2back + mismatch_td_diff_1back) - 1/4*(match_td_na_2back + match_td_na_1back + mismatch_td_na_2back + mismatch_td_na_1back)"
  interaction_nBack_shape: "1/2*(match_td_diff_2back + mismatch_td_diff_2back) - 1/2*(match_td_na_2back + mismatch_td_na_2back) - 1/2*(match_td_diff_1back + mismatch_td_diff_1back) + 1/2*(match_td_na_1back + mismatch_td_na_1back)"
  task-baseline: "1/12*(match_td_same_1back + match_td_same_2back + match_td_diff_1back + match_td_diff_2back + match_td_na_1back + match_td_na_2back + mismatch_td_same_1back + mismatch_td_same_2back + mismatch_td_diff_1back + mismatch_td_diff_2back + mismatch_td_na_1back + mismatch_td_na_2back)"
