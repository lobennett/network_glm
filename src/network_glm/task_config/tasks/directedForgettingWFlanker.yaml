tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: null

# Directed Forgetting × Flanker dual task.
# Factors on test_trial: flanker (congruent/incongruent) × DF probe (con/pos/neg).
# memory_and_cue models the memory-set + cue phase.

regressors:
  congruent_con:    {amplitude: 1, duration: 1, subset: "trial_type == 'congruent_con' and key_press == correct_response and response_time >= 0.2"}
  congruent_pos:    {amplitude: 1, duration: 1, subset: "trial_type == 'congruent_pos' and key_press == correct_response and response_time >= 0.2"}
  congruent_neg:    {amplitude: 1, duration: 1, subset: "trial_type == 'congruent_neg' and key_press == correct_response and response_time >= 0.2"}
  incongruent_con:  {amplitude: 1, duration: 1, subset: "trial_type == 'incongruent_con' and key_press == correct_response and response_time >= 0.2"}
  incongruent_pos:  {amplitude: 1, duration: 1, subset: "trial_type == 'incongruent_pos' and key_press == correct_response and response_time >= 0.2"}
  incongruent_neg:  {amplitude: 1, duration: 1, subset: "trial_type == 'incongruent_neg' and key_press == correct_response and response_time >= 0.2"}
  memory_and_cue:   {amplitude: 1, duration: duration, subset: "trial_id == 'test_cue' or trial_id == 'test_four_letters'"}
  response_time:    {amplitude: 1, duration: response_time, subset: "key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial'"}
  omission:         {amplitude: omission,    duration: duration, subset: null}
  commission:       {amplitude: commission,  duration: duration, subset: null}
  rt_fast:          {amplitude: rt_too_fast, duration: duration, subset: null}
  break_with_performance_feedback:
    amplitude: 1
    duration: duration
    subset: "trial_id == 'break_with_performance_feedback'"
    events_query_min_coverage: 0.0

contrasts:
  congruent_con:   "congruent_con"
  congruent_pos:   "congruent_pos"
  congruent_neg:   "congruent_neg"
  incongruent_con: "incongruent_con"
  incongruent_pos: "incongruent_pos"
  incongruent_neg: "incongruent_neg"
  congruent_neg-congruent_con:   "congruent_neg - congruent_con"
  incongruent_con-congruent_con: "incongruent_con - congruent_con"
  interaction_DF_flanker:        "1/2*(incongruent_neg + congruent_con) - 1/2*(incongruent_con + congruent_neg)"
  task-baseline: "1/7*(congruent_pos + congruent_neg + congruent_con + incongruent_pos + incongruent_neg + incongruent_con + memory_and_cue)"
