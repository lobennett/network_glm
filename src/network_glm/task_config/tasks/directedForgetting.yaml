tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 5

# Directed forgetting paradigm
# Trial types: con (control), pos (positive/remember), neg (negative/forget)
# memory_and_cue covers stimulus presentation and cue periods.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  con:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2
      and trial_type == "con"

  pos:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2
      and trial_type == "pos"

  neg:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2
      and trial_type == "neg"

  memory_and_cue:
    amplitude: 1
    duration: duration
    subset: 'trial_id == "test_stim" or trial_id == "test_cue"'

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2
      and trial_id == 'test_trial'

  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: "trial_id == 'break_with_performance_feedback'"
    events_query_min_coverage: 0.0

contrasts:
  neg-con: "neg - con"
  task-baseline: "1/4 * (con + pos + neg + memory_and_cue)"
  response_time: "response_time"
