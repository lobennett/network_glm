name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  pytest:
    name: Synthetic software suite (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.6"
          enable-cache: false
      - name: Install locked dependencies
        # uv reads the supported Python version from .python-version.
        run: uv sync --frozen --group dev
      - name: Run full synthetic suite
        run: uv run --frozen pytest -q -ra
