[project]
name = "network_glm"
version = "0.1.0"
description = "r01network first- and second-level task-fMRI GLMs (lev1/lev2) + cohort outlier detection"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0.3",
    # Pinned to a set that installs on Sherlock's glibc 2.17 nodes at 3.11 and 3.13.
    # pillow<12: pillow 12 has no wheel here and its source build needs libjpeg headers.
    "numpy==2.2.6",
    "scipy==1.14.1",
    "pandas==3.0.3",
    "nibabel==5.4.2",
    "nilearn==0.14.0",
    "statsmodels==0.14.6",
    "matplotlib==3.10.8",
    "pillow<12",
    "seaborn",
    # lev2's volume path lazy-imports setup_randomise_tfce.
    "randomise-prep",
]

[project.scripts]
network-glm = "network_glm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
randomise-prep = { git = "https://github.com/jmumford/randomise-prep.git", rev = "f740e74" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_glm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
