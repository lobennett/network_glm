[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network_glm"
version = "0.1.0"
description = "r01network first- and second-level task-fMRI GLMs (lev1/lev2) + cohort outlier detection"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0.3",
    # Scientific stack PINNED to a set proven to install on Sherlock's CentOS 7
    # (glibc 2.17) compute nodes — copied from the validated /scratch .venv_nort env.
    # Newer releases publish only manylinux_2_28 wheels for cp313 and fall back to
    # source builds that fail here (pillow 12.3.0 no wheel; scipy >=1.17 needs an
    # external OpenBLAS that isn't installed). scipy 1.14.1 is the newest with a
    # working cp311 manylinux2014 wheel, which is why this env targets python 3.11.
    # The byte-identical verification run (see docs plan Phase 6) happens inside the
    # container against the monolith's own stack; this env is for dev + offline tests.
    "numpy==2.2.6",
    "scipy==1.14.1",
    "pandas==3.0.3",
    "nibabel==5.4.2",
    "nilearn==0.14.0",
    "statsmodels==0.14.6",
    "matplotlib==3.10.8",
    "pillow==12.1.1",
    "seaborn",
    "randomise-prep @ git+https://github.com/jmumford/randomise-prep.git",
    "network_qa @ git+https://github.com/lobennett/network_qa.git",
    "bold-reliability-movies @ git+https://github.com/lobennett/bold_reliability_movies.git",
]

[project.scripts]
network-glm = "network_glm.cli:main"

[tool.hatch.metadata]
# our companion packages (network_qa, bold-reliability-movies) and randomise-prep
# are installed via git+ direct references
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/network_glm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
