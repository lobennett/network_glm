[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network_glm"
version = "0.1.0"
description = "r01network first- and second-level task-fMRI GLMs (lev1/lev2) + cohort outlier detection"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    # Scientific stack PINNED to the neuro_workflow@main lock versions. Two reasons:
    # (1) fresh resolution grabs newest releases that lack cp313 manylinux2014
    #     (glibc-2.17 / CentOS 7) wheels and fall back to source builds that fail
    #     (pillow 12.3.0 no wheel; scipy 1.18.0 needs external OpenBLAS; etc.).
    # (2) byte-identical verification vs the monolith needs the same numeric stack.
    "numpy==2.4.2",
    "scipy==1.17.1",
    "pandas==3.0.1",
    "nibabel==5.4.0",
    "nilearn==0.13.1",
    "statsmodels>=0.14",
    "matplotlib==3.10.8",
    "pillow==12.1.1",
    "seaborn",
    "randomise-prep @ git+https://github.com/jmumford/randomise-prep.git",
    "network_qa @ git+https://github.com/lobennett/network_qa.git",
    "bold-reliability-movies @ git+https://github.com/lobennett/bold_reliability_movies.git",
]

[project.scripts]
network-glm = "network_glm.cli:main"

[tool.hatch.metadata]
# our companion packages (network_qa, bold-reliability-movies) and randomise-prep
# are installed via git+ direct references
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/network_glm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
